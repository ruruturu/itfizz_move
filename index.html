<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Welcome Itzfizz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <section class="hero">
    <div class="inner">

      <div class="top">
        <h1 class="title">
          <span class="letter">W</span>
          <span class="letter">E</span>
          <span class="letter">L</span>
          <span class="letter">C</span>
          <span class="letter">O</span>
          <span class="letter">M</span>
          <span class="letter">E</span>
          <span class="space"></span>
          <span class="letter">I</span>
          <span class="letter">T</span>
          <span class="letter">Z</span>
          <span class="letter">F</span>
          <span class="letter">I</span>
          <span class="letter">Z</span>
          <span class="letter">Z</span>
        </h1>
        <p class="hint">Scroll down</p>
      </div>

      <div class="road">
        <div class="road-lines"></div>
        <div class="car">
          <svg viewBox="0 0 400 160">
            <rect x="58" y="4" width="62" height="30" rx="10" fill="#333"/>
            <rect x="290" y="4" width="62" height="30" rx="10" fill="#333"/>
            <rect x="58" y="126" width="62" height="30" rx="10" fill="#333"/>
            <rect x="290" y="126" width="62" height="30" rx="10" fill="#333"/>
            <path d="M20 80 C20 50 40 34 80 30 L250 26 C300 26 345 40 378 62 C390 70 390 90 378 98 C345 120 300 134 250 134 L80 130 C40 126 20 110 20 80 Z" fill="#ff4d12"/>
            <path d="M150 44 L225 40 C245 40 255 52 258 80 C255 108 245 120 225 120 L150 116 C135 112 128 96 128 80 C128 64 135 48 150 44 Z" fill="#10151c"/>
            <path d="M366 54 L386 62 L368 70 Z" fill="#fff6cf"/>
            <path d="M366 106 L386 98 L368 90 Z" fill="#fff6cf"/>
            <rect x="20" y="52" width="7" height="20" rx="3" fill="#ff2d2d"/>
            <rect x="20" y="88" width="7" height="20" rx="3" fill="#ff2d2d"/>
          </svg>
        </div>
      </div>

      <div class="stats">
        <div class="stat">
          <p class="value"><span class="number" data-value="58">58</span><span class="percent">%</span></p>
          <p class="text">Increase in pick up point use</p>
        </div>
        <div class="stat">
          <p class="value"><span class="number" data-value="23">23</span><span class="percent">%</span></p>
          <p class="text">Decrease in customer phone calls</p>
        </div>
        <div class="stat">
          <p class="value"><span class="number" data-value="27">27</span><span class="percent">%</span></p>
          <p class="text">Increase in pick up point use</p>
        </div>
        <div class="stat">
          <p class="value"><span class="number" data-value="40">40</span><span class="percent">%</span></p>
          <p class="text">Decrease in customer phone calls</p>
        </div>
      </div>

    </div>
  </section>

  <section class="footer">
    <p>Built with HTML, CSS, JavaScript and GSAP</p>
  </section>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
