<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Welcome Itzfizz</title>
    <meta
      name="description"
      content="Scroll-driven hero section animation built with HTML, CSS, JavaScript and GSAP."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <!-- Tall wrapper = scroll distance. The inner .hero__pin stays stuck while we scroll. -->
      <section class="hero" id="hero">
        <div class="hero__pin">
          <div class="glow" aria-hidden="true"></div>

          <header class="hero__top">
            <h1 class="headline" data-text="WELCOME ITZFIZZ" aria-label="Welcome Itzfizz"></h1>
            <p class="hint">Scroll &darr;</p>
          </header>

          <div class="road" aria-hidden="true">
            <div class="road__lines"></div>
            <div class="car">
              <svg viewBox="0 0 400 160" xmlns="http://www.w3.org/2000/svg" role="img">
                <defs>
                  <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0" stop-color="#ff7a3d" />
                    <stop offset="0.5" stop-color="#ff4d12" />
                    <stop offset="1" stop-color="#b8240a" />
                  </linearGradient>
                  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
                    <stop offset="0" stop-color="#1c232d" />
                    <stop offset="1" stop-color="#0c1016" />
                  </linearGradient>
                </defs>

                <!-- soft ground shadow -->
                <ellipse cx="200" cy="82" rx="182" ry="58" fill="#000" opacity="0.35" />

                <!-- wheels -->
                <g fill="#262a32" stroke="#4a4f5a" stroke-width="2">
                  <rect x="58" y="4" width="62" height="30" rx="10" />
                  <rect x="290" y="4" width="62" height="30" rx="10" />
                  <rect x="58" y="126" width="62" height="30" rx="10" />
                  <rect x="290" y="126" width="62" height="30" rx="10" />
                </g>

                <!-- body -->
                <path
                  d="M20 80 C20 50 40 34 80 30 L250 26 C300 26 345 40 378 62 C390 70 390 90 378 98 C345 120 300 134 250 134 L80 130 C40 126 20 110 20 80 Z"
                  fill="url(#body)"
                />
                <!-- hood crease -->
                <path
                  d="M262 42 C300 48 340 62 370 76 M262 118 C300 112 340 98 370 84"
                  fill="none"
                  stroke="#fff"
                  stroke-opacity="0.28"
                  stroke-width="2"
                  stroke-linecap="round"
                />
                <!-- cabin -->
                <path
                  d="M150 44 L225 40 C245 40 255 52 258 80 C255 108 245 120 225 120 L150 116 C135 112 128 96 128 80 C128 64 135 48 150 44 Z"
                  fill="url(#glass)"
                />
                <path
                  d="M160 54 L218 51 C232 51 240 60 242 80"
                  fill="none"
                  stroke="#fff"
                  stroke-opacity="0.18"
                  stroke-width="3"
                  stroke-linecap="round"
                />
                <!-- headlights -->
                <path d="M366 54 L386 62 L368 70 Z" fill="#fff6cf" />
                <path d="M366 106 L386 98 L368 90 Z" fill="#fff6cf" />
                <!-- tail lights -->
                <rect x="20" y="52" width="7" height="20" rx="3" fill="#ff2d2d" />
                <rect x="20" y="88" width="7" height="20" rx="3" fill="#ff2d2d" />
              </svg>
            </div>
          </div>

          <ul class="stats">
            <li class="stat">
              <p class="stat__value"><span class="num" data-value="58">58</span><span class="pct">%</span></p>
              <p class="stat__label">Increase in pick up point use</p>
            </li>
            <li class="stat">
              <p class="stat__value"><span class="num" data-value="23">23</span><span class="pct">%</span></p>
              <p class="stat__label">Decrease in customer phone calls</p>
            </li>
            <li class="stat">
              <p class="stat__value"><span class="num" data-value="27">27</span><span class="pct">%</span></p>
              <p class="stat__label">Increase in pick up point use</p>
            </li>
            <li class="stat">
              <p class="stat__value"><span class="num" data-value="40">40</span><span class="pct">%</span></p>
              <p class="stat__label">Decrease in customer phone calls</p>
            </li>
          </ul>
        </div>
      </section>

      <section class="after">
        <p>Scroll-driven hero &middot; built with HTML, CSS, JavaScript &amp; GSAP</p>
      </section>
    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
